name: Track upstream vechain/thor hayabusa

on:
  schedule:
    - cron: "0 * * * *" # hourly
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  track:
    name: Check upstream latest commit
    runs-on: ubuntu-latest
    steps:
      - name: Query upstream and upsert tracking issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const upstreamOwner = 'vechain';
            const upstreamRepo = 'thor';
            const upstreamBranch = 'release/hayabusa';

            async function getLatestCommit() {
              const { data } = await github.request('GET /repos/{owner}/{repo}/commits', {
                owner: upstreamOwner,
                repo: upstreamRepo,
                sha: upstreamBranch,
                per_page: 1
              });
              if (!Array.isArray(data) || data.length === 0) {
                throw new Error('No commits found for branch ' + upstreamBranch);
              }
              return data[0];
            }

            function formatBody(commit) {
              return [
                `Latest upstream commit: ${commit.sha}`,
                '',
                `Message: ${commit.commit.message}`,
                `Author: ${commit.commit.author?.name || 'unknown'} <${commit.commit.author?.email || 'unknown'}>`,
                `Date: ${commit.commit.author?.date || 'unknown'}`,
                `URL: ${commit.html_url}`,
                '',
                'This issue is maintained by the scheduled upstream tracker workflow.'
              ].join('\n');
            }

            const latest = await getLatestCommit();
            const issueTitle = `Upstream tracker: ${upstreamOwner}/${upstreamRepo}@${upstreamBranch}`;

            // Find existing issue
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            let trackerIssue = openIssues.find(i => i.title === issueTitle);

            if (!trackerIssue) {
              const { data: closedIssues } = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'closed',
                per_page: 100
              });
              trackerIssue = closedIssues.find(i => i.title === issueTitle);
            }

            if (!trackerIssue) {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: formatBody(latest)
              });
              core.info(`Created tracking issue #${created.data.number}`);
              core.setOutput('issue_number', String(created.data.number));
              core.setOutput('changed', 'true');
            } else {
              const body = trackerIssue.body || '';
              const shaMatch = body.match(/Latest upstream commit:\s*([0-9a-f]{7,40})/i);
              const lastSha = shaMatch ? shaMatch[1] : null;
              if (lastSha !== latest.sha) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: trackerIssue.number,
                  body: formatBody(latest),
                  state: 'open'
                });
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: trackerIssue.number,
                  body: [
                    'New upstream commit detected:',
                    `- SHA: ${latest.sha}`,
                    `- Message: ${latest.commit.message}`,
                    `- Author: ${latest.commit.author?.name || 'unknown'}`,
                    `- Date: ${latest.commit.author?.date || 'unknown'}`,
                    `- URL: ${latest.html_url}`
                  ].join('\n')
                });
                core.info(`Updated tracking issue #${trackerIssue.number}`);
                core.setOutput('changed', 'true');
              } else {
                core.info('No new upstream commit.');
                core.setOutput('changed', 'false');
              }
              core.setOutput('issue_number', String(trackerIssue.number));
            }
